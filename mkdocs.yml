site_name: ABA - Avvale Business Assistant
site_description: Conversational AI for SAP On-Premise environments
site_url: https://avvale.github.io/aba-docs-client/
repo_url: https://github.com/avvale/aba-docs-client
repo_name: avvale/aba-docs-client

theme:
  name: material
  language: en
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - toc.follow
    - navigation.instant
    - navigation.instant.progress
  logo: assets/avvale-logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github

extra:
  generator: false
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/avvale
      name: Avvale on LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/avvale
      name: Avvale on GitHub

extra_css:
  - styles/avvale.css

copyright: "&copy; 2025 Avvale — AI Solutions Team"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - print-site:
      add_cover_page: true
      cover_page_template: ""
      add_table_of_contents: true
      toc_title: "Table of Contents"
      toc_depth: 2
      print_page_title: "Print / Export PDF"
      enumerate_headings: false
      enumerate_figures: false

nav:
  - Home: index.md

  - Getting Started:
    - What is ABA?: getting-started/what-is-aba.md
    - Business Value: getting-started/business-value.md
    - Key Capabilities: getting-started/capabilities.md
    - Supported Modules: getting-started/supported-modules.md
    - Architecture Overview: getting-started/architecture.md
    - Security and Compliance: getting-started/security-overview.md
    - Implementation Overview: getting-started/implementation.md

  - SAP Modules:
    - FI / CO - Finance & Controlling: modules/fi.md
    - MM - Materials Management: modules/mm.md
    - SD - Sales & Distribution: modules/sd.md
    - PM - Plant Maintenance: modules/pm.md
    - HCM - Human Capital Management: modules/hcm.md
    - Additional Modules:
      - PP - Production Planning: modules/pp.md
      - QM - Quality Management: modules/qm.md
      - WM/EWM - Warehouse Management: modules/wm.md

  - Business Processes:
    - Cross-Module Queries: cross-module/cross-queries.md
    - Document Flow: cross-module/document-flow.md
    - Reporting & Analytics: cross-module/reporting.md
    - Master Data: cross-module/master-data.md

  - Technical Setup:
    - Technical Prerequisites: integration/prerequisites.md
    - Principal Propagation (SSO): integration/principal_propagation.md

  - Security & Architecture:
    - System Architecture (overview): architecture/system-architecture.md
    - Authentication & Security: architecture/authentication.md

  - FAQ:
    - Frequently Asked Questions: faq/faq.md
    - Known Limitations: faq/limitations.md

  - Roadmap:
    - Product Roadmap: changelog/roadmap.md

